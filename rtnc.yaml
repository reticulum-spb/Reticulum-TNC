  #           2=NORMAL punctured TC128 rate 2/3. FAST is not implemented.
  - name: qpsk_1200_robust64
    modulation: qpsk
    symbol_rate_baud: 1200
    carrier_hz: 1650.0
    rrc_rolloff: 0.25
    acquisition_threshold: 0.70
    training_threshold: 0.55
    detector_bandwidth_margin: 1.35
    fec_mode: 1
    payload_class_bytes: 64
